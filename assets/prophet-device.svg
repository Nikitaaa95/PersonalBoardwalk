<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img"
     aria-label="A gilt medallion: a hand cradling rising flame.">
  <defs>
    <radialGradient id="gild" cx="36%" cy="28%" r="80%">
      <stop offset="0"    stop-color="#eed595"/>
      <stop offset="0.5"  stop-color="#c9a557"/>
      <stop offset="1"    stop-color="#87682a"/>
    </radialGradient>
  </defs>

  <circle cx="50" cy="50" r="49" fill="url(#gild)"/>
  <circle cx="50" cy="50" r="43.5" fill="none" stroke="#6d5120" stroke-width="0.8" opacity="0.45"/>

  <clipPath id="disc"><circle cx="50" cy="50" r="43"/></clipPath>

  <!-- Held inside the ring with gold showing all round it, and between the
       tongues, so the device reads as stamped rather than as a dark mass. -->
  <g fill="#14100a" clip-path="url(#disc)"
     transform="translate(50 54) scale(0.70) translate(-50 -50)">
    <!-- Flame: broad tongues, tallest at the centre, leaning outward at the
         edges. Kept chunky so the forms survive at thumbnail size. -->
    <path d="M44 64 C39 50 43 33 50 18 C57 33 61 50 56 64 Z"/>
    <path d="M30 66 C27 54 31 43 37 33 C41 46 41 57 37 66 Z"/>
    <path d="M70 66 C73 54 69 43 63 33 C59 46 59 57 63 66 Z"/>
    <path d="M19 68 C18 60 21 52 26 46 C28 55 27 62 24 68 Z"/>
    <path d="M81 68 C82 60 79 52 74 46 C72 55 73 62 76 68 Z"/>

    <!-- The hand: forearm in from the left, palm cupped under the flame,
         three bold fingers curling up on the right. -->
    <path d="M4 71
             C9 81 23 88 39 89
             C55 90 69 86 78 78
             C84 73 87 67 87 60
             C84 61 81 63 78 64
             C80 60 80 55 78 51
             C75 55 72 58 68 60
             C70 56 70 51 68 47
             C65 52 61 56 56 58
             C46 62 28 60 16 62
             C9 63 5 66 4 71 Z"/>
  </g>
</svg>
